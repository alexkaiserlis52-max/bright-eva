<!DOCTYPE html>
<html>
<head>
    <title>Generated Report</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            max-width: 800px;
            margin: auto;
            line-height: 1.6;
            color: #333;
        }
        h1, h2, h3 {
            text-align: center;
        }
        p {
            margin-bottom: 10px;
        }
        .report {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
        }
        .info {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <img src="images/instudies.png" alt="InStudies Logo" style="display: block; margin: auto; max-width: 100%;">
    <h1>{{ type }} Report</h1>
    <div class="info">
        <h2>Name: {{ name }}</h2>
        <h3>Date: {{ date }}</h3>
    </div>
    <div class="report">
        {{ report|safe }}
    </div>
</body>
</html>
