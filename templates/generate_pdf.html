<script>
document.addEventListener('DOMContentLoaded', function() {
   // Get the loading bar element
   const loadingBar = document.getElementById('loading-bar').querySelector('.progress-bar');

   // Function to update the progress bar
   function updateProgressBar(progress) {
       loadingBar.style.width = `${progress}%`;
       loadingBar.setAttribute('aria-valuenow', progress);
   }

   // Simulate loading (you can replace this with actual loading logic)
   let progress = 0;
   const interval = setInterval(function() {
       progress += 10; // Increase progress by 10% (you can adjust this value)
       if (progress > 100) {
           clearInterval(interval);
           setTimeout(function() {
               // Hide the loading bar once loading is complete (you can adjust the delay)
               loadingBar.parentElement.style.display = 'none';
           }, 500);
       } else {
           updateProgressBar(progress);
       }
   }, 500); // Adjust the interval (milliseconds) for a smoother progress bar
});
</script>
