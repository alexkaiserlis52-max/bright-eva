<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bright E.V.A.{% endblock %} — Evaluation Virtual Assistant</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='eva_mark.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/eva.css') }}">
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <a class="brand" href="{{ url_for('main') }}">
                <img src="{{ url_for('static', filename='eva_mark.svg') }}" alt="Bright E.V.A.">
                <span>
                    <span class="brand-name">Bright E.V.A.</span>
                    <div class="brand-tag">Evaluation Virtual Assistant</div>
                </span>
            </a>

            <a class="nav-link" href="{{ url_for('guide') }}" data-tip-pos="east" data-tip="The full guide — what every page, safeguard and technical term means, in detail.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
                <span>Guide</span>
            </a>

            <div class="nav-label">Reports</div>
            <a class="nav-link" href="{{ url_for('main') }}#report-by-student" data-tip-pos="east" data-tip="Individual progress report for one student, built from all their assessment forms.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <span>Student</span>
            </a>
            <a class="nav-link" href="{{ url_for('main') }}#report-by-lesson" data-tip-pos="east" data-tip="How a lesson (subject) performed over time, across all students who took it.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M8 8h8M8 12h6"/></svg>
                <span>Lesson</span>
            </a>
            <a class="nav-link" href="{{ url_for('main') }}#report-by-group" data-tip-pos="east" data-tip="Overall picture of a whole class group — strengths, gaps and suggestions.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.8.4 5 2.3 5 5.5"/></svg>
                <span>Class</span>
            </a>

            <div class="nav-label">Tools</div>
            <a class="nav-link" href="{{ url_for('chat') }}" data-tip-pos="east" data-tip="Free-form questions to E.V.A. — answers are grounded in live sheet data via tool calls.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.4L22 18.3l-2.1.9L19 21.6l-.9-2.4-2.1-.9 2.1-.9z"/></svg>
                <span>Chat</span>
            </a>
            <a class="nav-link" href="{{ url_for('main') }}#ask-me" data-tip-pos="east" data-tip="Smart actions over saved reports: create/modify lesson plans, or diagnose one student against the class.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/><path d="M9 11h6M9 15h4"/></svg>
                <span>ASK ME</span>
            </a>
            <a class="nav-link" href="{{ url_for('style_page') }}" data-tip-pos="east" data-tip="Teach E.V.A. your report style — an example or instructions are distilled into a reusable style profile.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                <span>Style Studio</span>
            </a>

            <div class="nav-label">Transparency</div>
            <a class="nav-link" href="{{ url_for('pipeline_index') }}" data-tip-pos="east" data-tip="Glass-box traces: every run — data fetched, prompts sent, critic verdicts, cost, timing, risk signals.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/></svg>
                <span>Pipeline</span>
            </a>
            <a class="nav-link" href="{{ url_for('risk_register') }}" data-tip-pos="east" data-tip="The living risk register — 10 baseline risks plus every observation reviewers registered on real traces. Co-created, not a slide deck.">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10z"/><path d="M12 8v4M12 16h.01"/></svg>
                <span>Risk Register</span>
            </a>


            <div class="sidebar-footer">
                <div class="model-picker" data-tip-pos="east" data-tip="The AI model behind every report, chat answer and distillation. Live list from OpenRouter — provider, data terms and per-run cost appear on each pipeline trace.">
                    <label for="model-select">AI Model</label>
                    <select id="model-select">
                        <option>Loading…</option>
                    </select>
                </div>
                {% if auth_enabled %}
                <a class="logout-link" href="{{ url_for('logout') }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
                    Log out
                </a>
                {% endif %}
            </div>
        </aside>

        <main class="main">
            <div class="main-inner">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <div class="eva-overlay" id="eva-overlay">
        <div class="eva-spinner"><img src="{{ url_for('static', filename='eva_mark.svg') }}" alt=""></div>
        <div class="eva-stage" id="eva-stage">Preparing</div>
        <div class="eva-hint">AI report generation can take 30–90 seconds.</div>
    </div>

    <script>
    // ---------- AI model picker (live OpenRouter list, shared across pages) ----------
    (async function () {
        const sel = document.getElementById('model-select');
        if (!sel) return;
        try {
            const res = await fetch('/api/models');
            const data = await res.json();
            sel.innerHTML = '';
            data.models.forEach(m => {
                const o = document.createElement('option');
                o.value = m; o.textContent = m;
                sel.appendChild(o);
            });
            if (data.current) sel.value = data.current;
        } catch (e) {
            sel.innerHTML = '<option>Unavailable</option>';
            console.warn('Could not load live model list.', e);
        }
        sel.addEventListener('change', async () => {
            try {
                await fetch('/set_model', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: sel.value })
                });
            } catch (e) { console.warn('Could not save model selection.', e); }
        });
    })();

    // ---------- Staged loading overlay for report generation ----------
    (function () {
        const overlay = document.getElementById('eva-overlay');
        const stageEl = document.getElementById('eva-stage');
        const stages = [
            'Connecting to Google Sheets',
            'Reading assessments',
            'Anonymizing data',
            'Generating AI summaries',
            'Composing the final report',
            'Almost there'
        ];
        document.querySelectorAll('form[data-eva-loading]').forEach(form => {
            form.addEventListener('submit', () => {
                overlay.classList.add('show');
                let i = 0;
                stageEl.textContent = stages[0];
                const tick = setInterval(() => {
                    i = Math.min(i + 1, stages.length - 1);
                    stageEl.textContent = stages[i];
                    if (i === stages.length - 1) clearInterval(tick);
                }, 7000);
            });
        });
    })();

    // ---------- Default date inputs to today ----------
    (function () {
        const today = new Date().toISOString().slice(0, 10);
        document.querySelectorAll('input[type="date"]').forEach(inp => {
            if (!inp.value) inp.value = today;
        });
    })();
    </script>
</body>
</html>
