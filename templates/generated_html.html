<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ type }} Report — Bright E.V.A.</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='eva_mark.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/eva.css') }}">
</head>
<body>
    <div class="doc-actions no-print">
        <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Print / Save as PDF</button>
        <a class="btn btn-ghost btn-sm" href="{{ url_for('main') }}">← Back</a>
    </div>

    <div class="doc">
        <div class="doc-head">
            <img src="{{ url_for('static', filename='eva_mark.svg') }}" alt="Bright E.V.A.">
            <div>
                <h1 class="doc-title">{{ type }} Report</h1>
                <div class="doc-meta">{{ name }} · {{ date }} · Generated by Bright E.V.A. — anonymized data (GDPR)</div>
            </div>
        </div>
        <div class="doc-content">{{ report|safe }}</div>
    </div>
</body>
</html>
